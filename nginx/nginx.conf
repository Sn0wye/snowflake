events { }

http {
  upstream helium {
    server snowflake-helium:8080;
  }

  upstream carbon {
    server snowflake-carbon:8081;
  }

  upstream loan {
    server snowflake-loan:8082;
  }

  server {
    listen 80;

    # HTTP for helium
    location /auth {
      proxy_pass http://helium;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # HTTP for carbon
    location /score {
      proxy_pass http://carbon;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # HTTP for loan
    location /loan/ {
      proxy_pass http://loan;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
