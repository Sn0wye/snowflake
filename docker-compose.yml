services:
  # PostgreSQL DB
  postgres:
    image: postgres:18.3
    container_name: snowflake-postgres
    environment:
      POSTGRES_USER: snowflake
      POSTGRES_PASSWORD: snowflake
    ports:
      - '5432:5432'
    volumes:
      - ${POSTGRES_DATA_PATH:-/data/snowflake/postgres}:/var/lib/postgresql
      - ./init:/docker-entrypoint-initdb.d
    networks:
      - microservices-network
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'snowflake']
      interval: 1s
      timeout: 1s
      retries: 15
      start_period: 10s

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3-management
    container_name: snowflake-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: snowflake
      RABBITMQ_DEFAULT_PASS: snowflake
    volumes:
      - ${RABBITMQ_DATA_PATH:-/data/snowflake/rabbitmq}:/var/lib/rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'
    networks:
      - microservices-network
    healthcheck:
      test: ['CMD', 'rabbitmqctl', 'status']
      interval: 1s
      timeout: 1s
      retries: 30
      start_period: 30s

  # Proxy Server
  nginx:
    image: nginx:1.27-alpine
    container_name: snowflake-nginx
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - microservices-network
    depends_on:
      - helium
      - carbon
      - oxygen
      - gold

  # Authentication Service
  helium:
    build:
      context: ./helium
    image: snowflake-helium
    container_name: snowflake-helium
    ports:
      - '8080:8080'
      - '50050:50050'
    restart: on-failure
    labels:
      - 'prometheus.scrape=true'
      - 'prometheus.port=8080'
    environment:
      - DATABASE_URL=${HELIUM_DATABASE_URL:-}
      - RABBITMQ_URL=${HELIUM_RABBITMQ_URL:-}
      - JWT_SECRET=${HELIUM_JWT_SECRET:-}
      - JWT_ISSUER=${HELIUM_JWT_ISSUER:-}
      - REFRESH_TOKEN_SECRET=${HELIUM_REFRESH_TOKEN_SECRET:-}
      - HTTP_PORT=${HELIUM_HTTP_PORT:-8080}
      - GRPC_PORT=${HELIUM_GRPC_PORT:-50050}
      - LOG_LEVEL=${HELIUM_LOG_LEVEL:-info}
      - LOG_ENCODING=${HELIUM_LOG_ENCODING:-json}
      - ENV=${HELIUM_ENV:-production}
      - LOG_FILE_NAME=${HELIUM_LOG_FILE_NAME:-}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # Healthcheck is baked into the image (see helium/Dockerfile).
    networks:
      - microservices-network

  # Scorer Service
  carbon:
    build:
      context: ./carbon
    image: snowflake-carbon
    container_name: snowflake-carbon
    ports:
      - '8081:8081'
    restart: on-failure
    labels:
      - 'prometheus.scrape=true'
      - 'prometheus.port=8081'
    environment:
      - SPRING_PROFILES_ACTIVE=production
      - SPRING_DATASOURCE_URL=${CARBON_DATABASE_URL:-}
      - SPRING_RABBITMQ_HOST=${CARBON_RABBITMQ_HOST:-rabbitmq}
      - SPRING_GRPC_HOST=${CARBON_GRPC_HOST:-snowflake-helium}
      - SERVER_PORT=${CARBON_HTTP_PORT:-8081}
      - LOGGING_LEVEL_ROOT=${CARBON_LOG_LEVEL:-INFO}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      helium:
        condition: service_healthy
    networks:
      - microservices-network

  # Gold Service
  gold:
    build:
      context: ./gold
    image: snowflake-gold
    container_name: snowflake-gold
    ports:
      - '8083:8083'
    restart: on-failure
    labels:
      - 'prometheus.scrape=true'
      - 'prometheus.port=8083'
    environment:
      - DATABASE_URL=${GOLD_DATABASE_URL:-}
      - RABBITMQ_URL=${GOLD_RABBITMQ_URL:-}
      - JWT_SECRET=${GOLD_JWT_SECRET:-}
      - JWT_ISSUER=${GOLD_JWT_ISSUER:-}
      - HTTP_PORT=${GOLD_HTTP_PORT:-8083}
      - LOG_LEVEL=${GOLD_LOG_LEVEL:-info}
      - LOG_ENCODING=${GOLD_LOG_ENCODING:-json}
      - ENV=${GOLD_ENV:-production}
      - LOG_FILE_NAME=${GOLD_LOG_FILE_NAME:-}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      helium:
        condition: service_healthy
    networks:
      - microservices-network

  # Oxygen Service
  oxygen:
    build:
      context: ./oxygen
    image: snowflake-oxygen
    container_name: snowflake-oxygen
    ports:
      - '8082:8082'
    restart: on-failure
    labels:
      - 'prometheus.scrape=true'
      - 'prometheus.port=8082'
    environment:
      - ConnectionStrings__DefaultConnection=${OXYGEN_DATABASE_URL:-}
      - ConnectionStrings__UsersGrpc=${OXYGEN_GRPC_URL:-http://snowflake-helium:50050}
      - ConnectionStrings__CreditScorer=${OXYGEN_CREDITSCORER_URL:-http://snowflake-carbon:8081/score}
      - Security__Jwt__SecretKey=${OXYGEN_JWT_SECRET:-}
      - ASPNETCORE_HTTP_PORTS=${OXYGEN_HTTP_PORT:-8082}
      - Logging__LogLevel__Default=${OXYGEN_LOG_LEVEL:-Information}
      - ASPNETCORE_ENVIRONMENT=${OXYGEN_ENVIRONMENT:-Production}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      helium:
        condition: service_healthy
      carbon:
        condition: service_started
    networks:
      - microservices-network

# Network Configuration
networks:
  microservices-network:
    driver: bridge
