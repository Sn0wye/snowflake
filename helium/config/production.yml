env: production
http:
  port: 8080
  secure: true
grpc:
  port: 50050
security:
  jwt_secret: ${JWT_SECRET}
  refresh_secret: ${REFRESH_TOKEN_SECRET}
  jwt_issuer: snowflake
db:
  driver: postgres
  connectionString: ${DATABASE_URL}
messaging:
  connectionString: ${RABBITMQ_URL}
google:
  client_id: ${GOOGLE_CLIENT_ID}
  client_secret: ${GOOGLE_CLIENT_SECRET}
  redirect_url: ${GOOGLE_REDIRECT_URL}

rate_limit:
  enabled: true
  auth: 5
log:
  level: info
  encoding: json
  log_file_name: ''
  max_backups: 0
  max_age: 0
  max_size: 0
  compress: false
