env: local
http:
  port: 8083
security:
  jwt_secret: change-me-in-production-jwt-secret
  jwt_issuer: snowflake
db:
  driver: postgres
  host: 127.0.0.1
  port: 5432
  database: gold
  user: snowflake
  password: snowflake
  connectionString: postgres://snowflake:snowflake@127.0.0.1:5432/gold?sslmode=disable
messaging:
  connectionString: amqp://snowflake:snowflake@localhost:5672
log:
  level: info
  encoding: console # json or console
  log_file_name: './storage/logs/server.log'
  max_backups: 30
  max_age: 7
  max_size: 1024
  compress: true
