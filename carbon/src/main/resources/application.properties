spring.application.name=carbon
springdoc.swagger-ui.path=/swagger.html
openapi.output.path=openapi.json
openapi.export.enabled=true
server.port=8081
logging.level.org=INFO
tutorial.client.duration=10000
spring.datasource.url=jdbc:postgresql://localhost:5432/carbon
spring.datasource.username=snowflake
spring.datasource.password=snowflake
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=snowflake
spring.rabbitmq.password=snowflake
spring.rabbitmq.listener.simple.missing-queues-fatal=false
spring.grpc.host=127.0.0.1
spring.grpc.port=50050
ratelimit.enabled=true
ratelimit.score-per-second=10